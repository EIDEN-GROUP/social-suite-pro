name: Scheduled publishing

# Vercel Hobby only allows daily cron jobs, so this workflow drives the
# publishing runner more frequently. GitHub's scheduler has a 5-minute minimum
# and can be delayed under load; "Publish Now" is always immediate and does not
# depend on this. Adjust the interval below if you prefer a different cadence.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   APP_BASE_URL  e.g. https://simulator.eiden-group.com
#   CRON_SECRET   must match the CRON_SECRET env var on the deployment

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scheduled-publishing
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call the publishing runner
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_BASE_URL and CRON_SECRET repository secrets are required."
            exit 1
          fi
          curl --fail-with-body -sS -X POST "${APP_BASE_URL%/}/api/cron/publish" \
            -H "Authorization: Bearer ${CRON_SECRET}"